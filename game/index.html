<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Void — arena survival</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04050d; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block; touch-action: none; cursor: crosshair;
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    box-shadow: 0 0 80px rgba(64, 224, 255, 0.12);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Neon Void: a twin-stick arena survival shooter. Move with W A S D, aim with the mouse, hold the mouse button or Space to fire, survive ten waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
